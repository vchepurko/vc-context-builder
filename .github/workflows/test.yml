name: 🧪 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover tests/ -v
      - name: Smoke test agent_map.py
        run: |
          python agent_map.py
          test -f agent_root.json
          test -f agent_symbols.json
      - name: Smoke test CLI
        run: python cli.py roles
      - name: Smoke test MCP server
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | timeout 5 python mcp_server.py | head -1 | grep -q '"vc-context"'
