[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = (?x)(
    ^\.vc-context/
    | ^__pycache__/
    | ^parsers/__pycache__/
    | ^_module_map\.json$
  )

# Tests assert against the runtime shape (`assertEqual`,
# `assertIsNotNone`, etc.) so the Optional[dict] noise from
# `find_symbol(...)` callers is signal-poor. Keep the strict surface
# on real code; relax on tests/.
[mypy-tests.*]
disable_error_code = index, union-attr, attr-defined, arg-type, return-value
